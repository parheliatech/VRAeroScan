[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*"
export_path="vraeroscan.apk"

[preset.0.options]

; Gradle build: required for the VitureGlasses plugin.
gradle_build/use_gradle_build=true
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="org.vraeroscan.app"
; Bump both for each release: the code must grow for an install over the last one to work.
version/code=2
version/name="0.1.1"
package/name="VRAeroScan"
launcher_icons/main_192x192="res://icons/main_192.png"
launcher_icons/adaptive_foreground_432x432="res://icons/foreground.png"
launcher_icons/adaptive_background_432x432="res://icons/background.png"
launcher_icons/adaptive_monochrome_432x432="res://icons/monochrome.png"
package/signed=true
; One icon only: the plugin's LaunchOnGlassesActivity ("VRAeroScan") starts the app on the
; glasses, or on the phone without them. Godot's own launcher entry would open it on the phone.
package/show_in_app_library=false
screen/immersive_mode=true
; adsb.lol over HTTPS.
permissions/internet=true
